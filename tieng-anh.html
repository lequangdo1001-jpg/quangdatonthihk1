<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh 6 – Hành trình của Quang Đạt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1740; --ink2:#4a4673; --bg:#1d1a4a; --bg2:#2b2770; --card:#ffffff; --line:#e4e1f5;
  --yellow:#ffcf33; --coral:#ff5d73; --teal:#16c7b0; --green:#2fbf5b; --red:#e8394f; --blue:#3d7bff; --purple:#7a4dff;
  --shadow:0 6px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 20% 0%,#3a2f9a 0,transparent 45%),radial-gradient(circle at 100% 40%,#5a1f7a 0,transparent 40%);min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.1;margin:0}
button{font-family:inherit;cursor:pointer;border:0}
sup{font-size:.68em;line-height:0}
o{text-decoration:overline;text-decoration-thickness:2px}
.hidden{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:16px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;padding:12px 20px;border-radius:14px;background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #c99a00;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a00}
.btn.teal{background:var(--teal);color:#fff;box-shadow:0 5px 0 #0c8a7a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9c4ea}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 #b8344a}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn.off{opacity:.45}

/* ---------- map ---------- */
.mapHead{display:flex;align-items:center;gap:14px;color:#fff;padding:8px 0 6px}
.mapHead .face{width:72px;height:72px;border-radius:50%;border:4px solid var(--yellow);object-fit:cover;flex:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mapHead h1{font-size:28px}
.mapHead p{margin:2px 0 0;opacity:.8;font-weight:700;font-size:14px}
.mapHead .sp{flex:1}
.tools{display:flex;gap:8px}
.story{background:rgba(255,255,255,.08);color:#e8e5ff;border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px;margin:8px 0 6px;border:1px dashed rgba(255,255,255,.25)}
.starTotal{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:30px;font-weight:800;color:var(--yellow)}
.starTotal svg{width:18px;height:18px}
.path{position:relative;padding:20px 0 10px}
.path:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(#ffffff55 0 14px,transparent 14px 26px);border-radius:3px}
.node{position:relative;width:calc(50% - 30px);margin:0 0 18px;display:flex}
.node.r{margin-left:calc(50% + 30px)}
.node .dot{position:absolute;top:26px;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:4px solid var(--bg);box-shadow:0 0 0 3px var(--yellow)}
.node.l .dot{right:-41px}.node.r .dot{left:-41px}
.node.done .dot{background:var(--green);box-shadow:0 0 0 3px var(--green)}
.lvl{flex:1;text-align:left;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;transition:transform .12s}
.lvl:hover{transform:translateY(-3px) rotate(-.5deg)}
.lvl .th{width:58px;height:58px;border-radius:14px;flex:none;overflow:hidden}
.lvl .th svg{width:100%;height:100%;display:block}
.lvl .num{font-size:12px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.5px}
.lvl h3{font-size:20px;margin:1px 0}
.lvl .sub{font-size:13px;color:var(--ink2);font-weight:600}
.lvl .stars{display:flex;gap:2px;margin-top:4px}
.lvl .stars svg{width:18px;height:18px}
.lvl .tries{font-size:12px;color:#8a86ad;font-weight:700;margin-left:6px}
.goalCard{margin:6px auto 24px;max-width:420px;background:linear-gradient(135deg,#ff9a3c,#ff5d73);color:#fff;border-radius:22px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);position:relative}
.goalCard .cage{position:relative;width:86px;height:86px;flex:none}
.goalCard .cage img{width:86px;height:86px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.goalCard .cage svg{position:absolute;inset:-6px;width:98px;height:98px}
.goalCard h3{font-size:22px}
.goalCard p{margin:4px 0 0;font-weight:700;font-size:14px;opacity:.95}
.goalCard.free .cage svg{display:none}
@media (max-width:620px){
  .path:before{left:22px}
  .node,.node.r{width:auto;margin-left:52px}
  .node.l .dot,.node.r .dot{left:-41px;right:auto}
  .mapHead h1{font-size:23px}
  .mapHead .face{width:58px;height:58px}
}

/* ---------- play ---------- */
#play{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;max-width:900px;width:100%;margin:0 auto}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;font-family:'Baloo 2';font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{font-size:12px;opacity:.75;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);border-radius:30px;padding:5px 10px;font-weight:900;font-size:15px}
.pill svg{width:18px;height:18px}
.hearts svg{width:18px;height:18px;margin:0 -1px}
.stageWrap{max-width:900px;width:100%;margin:0 auto;padding:0 12px}
.stage{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.3);background:#000;aspect-ratio:640/300}
.stage svg{display:block;width:100%;height:100%}
.prog{height:8px;background:rgba(255,255,255,.15);border-radius:6px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--coral));border-radius:6px;transition:width .4s}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.flashR{animation:flashR .5s}
@keyframes flashR{50%{box-shadow:0 0 0 6px var(--red),0 6px 0 rgba(0,0,0,.3)}}

.qcard{max-width:900px;width:calc(100% - 24px);margin:14px auto 30px;background:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.qtag{display:inline-block;background:#efeaff;color:var(--purple);font-weight:900;font-size:13px;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.qtext{font-size:20px;font-weight:700;line-height:1.45}
.qtext .passage{font-size:15px;font-weight:600;background:#f7f5ff;border-left:5px solid var(--purple);padding:10px 12px;border-radius:10px;margin:0 0 12px;max-height:240px;overflow:auto;line-height:1.5}
.qtext .passage p{margin:0 0 6px}
.qtext .sug{font-size:15px;font-weight:600;background:#fff8e1;border-radius:10px;padding:8px 12px;margin-top:8px;color:#5a4a00}
.fig{display:block;max-width:300px;width:100%;margin:10px auto 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#f4f2ff;border:3px solid #e0dbff;border-radius:14px;padding:11px 12px;font-size:17px;font-weight:700;color:var(--ink);transition:transform .08s,background .15s}
.opt:hover{background:#ebe6ff}
.opt:active{transform:scale(.98)}
.opt .L{flex:none;width:32px;height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--purple);border:2px solid #e0dbff}
.opt.bad{background:#ffe3e7;border-color:var(--red);opacity:.7;pointer-events:none}
.opt.bad .L{background:var(--red);color:#fff;border-color:var(--red)}
.opt.good{background:#dcf8e5;border-color:var(--green)}
.opt.good .L{background:var(--green);color:#fff;border-color:var(--green)}
.opt.sel{border-color:var(--purple);background:#e7e0ff}
.locked .opt{pointer-events:none}
.rows{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f7f5ff;border-radius:12px;padding:8px 10px}
.prow .lab{flex:1 1 200px;font-weight:700;font-size:17px}
.prow .ch{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-width:46px;padding:8px 12px;border-radius:10px;background:#fff;border:3px solid #e0dbff;font-weight:900;font-size:17px;color:var(--ink)}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.chip.good{background:var(--green);border-color:var(--green);color:#fff}
.chip.bad{background:var(--red);border-color:var(--red);color:#fff}
.prow.wrong{outline:3px solid var(--red)}
.inrow{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.inrow .pre,.inrow .unit{font-weight:800;font-size:19px}
.inp{flex:1 1 180px;min-width:0;font:inherit;font-size:20px;font-weight:800;padding:11px 14px;border-radius:14px;border:3px solid #d9d3ff;background:#faf9ff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--purple);background:#fff}
.inp.ok{border-color:var(--green);background:#e9fbef}
.inp.no{border-color:var(--red);background:#fff0f2}
.inp.wide{flex-basis:100%}
.setwrap{display:flex;align-items:center;gap:6px;flex:1 1 260px}
.setwrap .br{font-size:28px;font-weight:900;color:var(--purple)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.key{background:#efeaff;color:var(--purple);font-weight:900;font-size:18px;min-width:44px;padding:7px 10px;border-radius:10px}
textarea.inp{min-height:170px;resize:vertical;font-size:17px;font-weight:600;line-height:1.5}
.wc{font-weight:800;font-size:14px;color:var(--ink2);margin-top:6px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.actions .sp{flex:1}
.hintBtn{display:inline-flex;align-items:center;gap:10px;background:#fff6dc;color:#6b4a00;border:3px dashed #f2c14e;border-radius:40px;padding:5px 16px 5px 5px;font-weight:800;font-size:15px}
.hintBtn img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #f2c14e}
.hintBtn:hover{background:#ffefc0}
.hintBox{margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.hintBox .do{flex:none;text-align:center;width:74px}
.hintBox .do img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:4px solid #f2c14e;animation:bob 2.4s ease-in-out infinite}
.hintBox .do span{display:block;font-size:12px;font-weight:900;color:#b07c00}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.bubble{flex:1;background:#fff8e1;border:3px solid #f2c14e;border-radius:18px;padding:10px 14px;position:relative}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;border:9px solid transparent;border-right-color:#f2c14e}
.bubble ol{margin:0;padding-left:22px}
.bubble li{font-size:17px;font-weight:700;margin:4px 0;line-height:1.45;animation:pop .35s ease-out}
.bubble li::marker{font-weight:900;color:#b07c00}
.bubble .nx{margin-top:8px;background:#f2c14e;color:#4a3300;font-weight:900;padding:7px 14px;border-radius:10px;font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.fb{margin-top:14px;border-radius:14px;padding:11px 14px;font-weight:800;font-size:17px;display:flex;gap:10px;align-items:center;animation:pop .3s}
.fb.good{background:#dcf8e5;color:#11692f}
.fb.bad{background:#ffe3e7;color:#9c1630}
.fb.info{background:#eef3ff;color:#1d3f8f}
.fb svg{width:28px;height:28px;flex:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,10,40,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:zoom .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes zoom{from{transform:scale(.7);opacity:0}}
.mbox h2{font-size:30px;text-align:center}
.mbox .lead{text-align:center;font-weight:700;color:var(--ink2);margin:8px 0 14px}
.mbox .bigstars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.mbox .bigstars svg{width:56px;height:56px}
.mbox .bigstars svg.on{animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:#f4f2ff;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Baloo 2';font-size:26px;line-height:1}
.stat span{font-size:13px;font-weight:700;color:var(--ink2)}
.mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.sendst{text-align:center;font-weight:800;font-size:14px;margin-top:6px}
.review{margin-top:12px}
.review h4{margin:0 0 6px;font-family:'Baloo 2';font-size:18px}
.review .it{background:#fff5f6;border-left:4px solid var(--red);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:14px;font-weight:600}
.review .it .passage{display:none}
.review .it em{font-style:normal;color:#11692f;font-weight:900}
.introFaces{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:8px}
.introFaces img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--yellow)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;box-shadow:0 6px 0 rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:pop .3s;max-width:92vw}
.toast img{width:40px;height:40px;border-radius:50%;object-fit:cover}

/* scene anims */
.twinkle{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.waveA{animation:wave 3s linear infinite}
.waveB{animation:wave 4.5s linear infinite reverse}
@keyframes wave{to{transform:translateX(-80px)}}
.bobS{animation:bobS 2.2s ease-in-out infinite}
@keyframes bobS{50%{transform:translateY(-8px)}}
.spinC{animation:spinC 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinC{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
.flag{animation:flag 1s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes flag{50%{transform:skewY(8deg) scaleX(.9)}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.drift{animation:drift 30s linear infinite}
@keyframes drift{to{transform:translateX(-640px)}}
/* mobile polish */
.topbar .t b,.topbar .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t b{font-family:'Baloo 2','Nunito',system-ui,sans-serif}
.setwrap{flex:1 1 100%;min-width:0}
.setwrap .inp{flex:1 1 auto;width:100%;min-width:0}
@media (max-width:620px){
  .mapHead{flex-wrap:wrap}
  .mapHead>div:nth-child(2){flex:1;min-width:0}
  .mapHead .sp{display:none}
  .tools{width:100%;justify-content:flex-end;margin-top:-4px}
  .topbar .pill{padding:4px 7px;font-size:14px}
  .hearts svg{width:15px;height:15px}
  .qtext{font-size:18px}
}
.ctx{background:#eef6ff;border:2px solid #b9d6ff;border-radius:14px;padding:10px 14px 11px;margin:0 0 10px;font-size:17px;font-weight:700;line-height:1.45;color:#1d3f8f}
.ctx span{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#3d7bff;margin-bottom:2px}
.mapHead .face.blk{display:flex;align-items:flex-end;justify-content:center;background:#ffcf33;overflow:hidden;padding-top:4px}
.mapHead .face.blk svg{margin-bottom:-26px}
.rain{animation:rain .6s linear infinite}
@keyframes rain{from{transform:translate(0,-40px)}to{transform:translate(-10px,40px)}}

</style>
</head>

  h:['Đọc to: go /gəʊ/, flow /fləʊ/, so /səʊ/ – đều là âm "âu".','cover /ˈkʌvə/ – chữ o đọc là "ă" (âm /ʌ/).']},
 {q:'2. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['fl<u>o</u>w','l<u>o</u>ve','st<u>o</u>ne','N<u>o</u>vember'], a:1,
  h:['flow, stone, November: chữ o đọc là /əʊ/ ("âu").','love /lʌv/: chữ o đọc là /ʌ/ ("ă").']},
 {q:'3. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['s<u>u</u>mmer','s<u>u</u>n','gl<u>u</u>e','sh<u>u</u>t'], a:2,
  h:['summer, sun, shut: chữ u đọc là /ʌ/ ("ă").','glue /gluː/: chữ u đọc là /uː/ ("u" kéo dài).']},
 {q:'4. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['sl<u>o</u>wly','f<u>o</u>am','c<u>o</u>ver','h<u>o</u>me'], a:2,
  h:['slowly, foam, home: đọc /əʊ/ ("âu").','cover: đọc /ʌ/ – giống câu 1.']},
 {q:'8. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['st<u>u</u>dy','st<u>u</u>dent','st<u>u</u>dio','st<u>u</u>pid'], a:0,
  h:['student, studio, stupid: chữ u đọc là /juː/ ("iu").','study /ˈstʌdi/: chữ u đọc là /ʌ/ ("ă").']},
 {q:'9. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['h<u>ou</u>se','ab<u>ou</u>t','h<u>ou</u>r','c<u>ou</u>ntry'], a:3,
  h:['house, about, hour: "ou" đọc là /aʊ/ ("ao").','country /ˈkʌntri/: "ou" đọc là /ʌ/ ("ă").']},
 {q:'10. Choose the word whose underlined part is pronounced differently:', t:'mcq', o:['l<u>u</u>nch','f<u>u</u>n','j<u>u</u>do','s<u>u</u>n'], a:2,
  h:['lunch, fun, sun: đọc /ʌ/ ("ă").','judo /ˈdʒuːdəʊ/: chữ u đọc là /uː/ ("u").']}
]},
/* ================= 2 ================= */
{id:'a2', title:'Quái vật không gian', sub:'Multiple choice 1 – 17', theme:'space',
 intro:'Quái vật không gian xuất hiện! Mỗi câu đúng là một phát laser. Chú ý thì hiện tại đơn và hiện tại tiếp diễn nhé!',
 qs:[
 {q:'1. I sometimes ____ to the cinema.', t:'mcq', o:['go','goes','going','to go'], a:0,
  h:['"sometimes" (thỉnh thoảng) là dấu hiệu của thì <b>hiện tại đơn</b>.','Chủ ngữ là I → động từ giữ nguyên, không thêm s.']},
 {q:'2. John ____ much better now.', t:'mcq', o:['feel','feels','feeling','is feeling'], a:3,
  h:['"now" (bây giờ) là dấu hiệu của thì <b>hiện tại tiếp diễn</b>.','Công thức: S + is/am/are + V-ing. John → is.']},
 {q:'3. I ____ football every weekend.', t:'mcq', o:['study','have','play','do'], a:2,
  h:['Chơi một môn thể thao có bóng thì dùng động từ "play".','play football = chơi bóng đá.']},
 {q:'4. She ____ English at the moment.', t:'mcq', o:['study','is studying','studies','studying'], a:1,
  h:['"at the moment" (ngay lúc này) → hiện tại tiếp diễn.','She → is + V-ing.']},
 {q:'5. She is ____ hard for her A levels.', t:'mcq', o:['having','playing','studying','doing'], a:2,
  h:['Đã có "is" rồi, cần V-ing.','"Học chăm chỉ cho kì thi" = study hard.']},
 {q:'6. I always ____ a cooked breakfast.', t:'mcq', o:['have','do','play','study'], a:0,
  h:['"Ăn sáng" trong tiếng Anh là have breakfast.','always → hiện tại đơn, I → have.']},
 {q:'7. She ____ to be an architect.', t:'mcq', o:['study','studies','studying','is studying'], a:1,
  h:['Câu nói về việc thường xuyên (học để trở thành kiến trúc sư) → hiện tại đơn.','She → động từ thêm s/es. study kết thúc bằng phụ âm + y → đổi y thành i + es: studies.']},
 {q:'8. I ____ a one-hour lunch break.', t:'mcq', o:['play','have','do','study'], a:1,
  h:['"Có một giờ nghỉ trưa" → have a lunch break.']},
 {q:'9. I\'m ____ physics, biology and chemistry.', t:'mcq', o:['playing','having','doing','going'], a:2,
  h:['Đã có "I\'m" → cần V-ing.','Học các môn (vật lí, sinh, hóa) trong tiếng Anh hay dùng "do": do physics.']},
 {q:'10. Do you want to ____ cards with me?', t:'mcq', o:['play','come','have','learn'], a:0,
  h:['Chơi bài = play cards.']},
 {q:'11. What\'s the date today? – It is ____ June.', t:'mcq', o:['twelve','twelfth','twelve of','the twelfth of'], a:3,
  h:['Đọc ngày tháng dùng <b>số thứ tự</b>: twelfth (thứ 12).','Cách đọc: the + số thứ tự + of + tháng → the twelfth of June.']},
 {q:'12. How many windows are there in your house? – ____ six.', t:'mcq', o:['There is','There are','There has','There have'], a:1,
  h:['six (6 cái cửa sổ) là số nhiều.','Số nhiều dùng There are. Không có "There has/There have".']},
 {q:'13. ____ is Phong? – He\'s in the living room.', t:'mcq', o:['When','Where','Who','What'], a:1,
  h:['Câu trả lời "in the living room" chỉ <b>nơi chốn</b>.','Hỏi nơi chốn dùng Where (ở đâu).']},
 {q:'14. Which verb adds -es in the third person?', t:'mcq', o:['go','write','sleep','tell'], a:0,
  h:['Thêm -es với động từ tận cùng là O, CH, S, X, SH, Z.','go tận cùng là o → goes.']},
 {q:'15. ____ a clock in your room?', t:'mcq', o:['Are there','Is there','Have there','Has there'], a:1,
  h:['"a clock" (một cái đồng hồ) là số ít.','Câu hỏi số ít: Is there + a/an + danh từ?']},
 {q:'16. There are a lot of things ____ in Da Lat.', t:'mcq', o:['see','to see','seeing','to seeing'], a:1,
  h:['"Nhiều thứ để xem" → things + to + V.','to see.']},
 {q:'17. It is called the Tiger room ____ there is a big tiger on the wall.', t:'mcq', o:['because','so','but','like'], a:0,
  h:['Vế sau giải thích <b>lý do</b> tên phòng là "Tiger room".','Chỉ lý do dùng because (bởi vì).']}
]},
/* ================= 3 ================= */
{id:'a3', title:'Thoát phòng Roblox', sub:'Multiple choice 18 – 33', theme:'chase',
 intro:'Gã khổng lồ Roblox đang đuổi Đạt! Mỗi câu đúng mở một cánh cửa. Sai một câu là gã tiến lại gần một bước.',
 qs:[
 {q:'18. I live ____ my parents and my younger sister in a town house ____ Ha Noi.', t:'mcq', o:['with – at','at – at','of – in','with – in'], a:3,
  h:['Sống cùng ai: live <b>with</b> somebody.','Trong một thành phố dùng <b>in</b>: in Ha Noi.']},
 {q:'19. We are moving ____ a new house ____ the city centre soon.', t:'mcq', o:['to – in','at – at','to – from','from – in'], a:0,
  h:['Chuyển <b>đến</b> nhà mới: move to.','Ở trong trung tâm thành phố: in the city centre.']},
 {q:'20. We live in a town house, but our grandparents live in a ____ house.', t:'mcq', o:['villa','country','apartment','city'], a:1,
  h:['Có từ "but" (nhưng) → ý đối lập với town house (nhà phố).','country house = nhà ở quê.']},
 {q:'21. Our class is going to ____ a picnic at the zoo on Saturday. Would you like to come with us?', t:'mcq', o:['have','take','pass','go'], a:0,
  h:['"Đi dã ngoại" = have a picnic (hoặc go on a picnic).']},
 {q:'22. It\'s ____ to go home. It\'s so late.', t:'mcq', o:['now','sure','time','like'], a:2,
  h:['"Đến lúc đi về rồi" = It\'s time to + V.']},
 {q:'23. Please turn ____ the lights. The room is so dark.', t:'mcq', o:['with','at','in','on'], a:3,
  h:['Phòng tối → cần <b>bật</b> đèn.','Bật = turn on; tắt = turn off.']},
 {q:'24. Can you ____ the tables and chairs ____ the next room? There are some more students.', t:'mcq', o:['move – to','take – in','move – in','take – on'], a:0,
  h:['Chuyển đồ <b>sang</b> phòng bên cạnh: move something to somewhere.']},
 {q:'25. Daisy is very ____ to take the test. She is a very good student.', t:'mcq', o:['kind','confident','friendly','talkative'], a:1,
  h:['Học giỏi thì đi thi sẽ thấy thế nào? Tự tin!','confident = tự tin.']},
 {q:'26. CLOSEST in meaning: The film is not worth seeing. The plot is too <u>boring</u>.', t:'mcq', o:['simple','exciting','uninteresting','slow'], a:2,
  h:['boring = chán, nhàm.','uninteresting = không thú vị (un- nghĩa là "không").']},
 {q:'27. CLOSEST in meaning: I <u>like</u> history because it helps me understand a lot of things in the past.', t:'mcq', o:['enjoy','hate','work','hope'], a:0,
  h:['like = thích. Tìm từ cũng có nghĩa là thích.','hate là ghét (ngược nghĩa).']},
 {q:'28. CLOSEST in meaning: Many things make it <u>difficult</u> for women to reach the top in society.', t:'mcq', o:['easy','hard','studious','nice'], a:1,
  h:['difficult = khó.','hard cũng có nghĩa là khó. easy là dễ (ngược nghĩa).']},
 {q:'29. CLOSEST in meaning: I study <u>many</u> subjects such as Math, Physics, Chemistry...', t:'mcq', o:['some','a lot of','a few','much'], a:1,
  h:['many = nhiều.','a lot of = nhiều. (much cũng là nhiều nhưng chỉ dùng với danh từ không đếm được.)']},
 {q:'30. OPPOSITE in meaning: Our teacher <u>remembers</u> all of my classmates\' birthday.', t:'mcq', o:['gives','forgets','asks','has'], a:1,
  h:['remember = nhớ. Ngược lại là quên.','forget = quên.']},
 {q:'31. OPPOSITE in meaning: <u>In front of</u> my school, there is a big park.', t:'mcq', o:['In the middle of','Behind','Under','Between'], a:1,
  h:['in front of = ở phía trước.','Ngược với "phía trước" là "phía sau" = behind.']},
 {q:'32. OPPOSITE in meaning: Ba is tired since he stayed up <u>late</u> watching TV.', t:'mcq', o:['easily','early','busily','quickly'], a:1,
  h:['late = muộn. Ngược lại là sớm.','early = sớm.']},
 {q:'33. OPPOSITE in meaning: Mono gets <u>good</u> marks in the exams because he is hard-working.', t:'mcq', o:['bad','sad','high','big'], a:0,
  h:['good = tốt. Ngược lại là xấu, kém.','bad marks = điểm kém.']}
]},
/* ================= 4 ================= */
{id:'a4', title:'Tycoon từ vựng', sub:'Word forms – Dạng đúng của từ', theme:'tycoon',
 intro:'Đạt mở nhà máy riêng! Mỗi từ đúng mua được một phần mới cho nhà máy. Xây xong là có tòa nhà ĐẠT TYCOON.',
 qs:[
 {q:'1. Lan always makes her friend laugh. She is very ________. <b>(FUN)</b>', t:'text', a:['funny'],
  h:['Sau "very" cần một <b>tính từ</b>.','fun + n + y = funny (vui tính).']},
 {q:'2. Thu always pays attention to what she is doing. She is ________. <b>(CARE)</b>', t:'text', a:['careful'],
  h:['Sau "is" cần tính từ.','care + ful = careful (cẩn thận).']},
 {q:'3. Bao is always talking in class. He is very ________. <b>(TALK)</b>', t:'text', a:['talkative'],
  h:['Cần tính từ chỉ người hay nói.','talk + ative = talkative (nói nhiều).']},
 {q:'4. Miss Lan is a ________ woman. <b>(BEAUTY)</b>', t:'text', a:['beautiful'],
  h:['Đứng trước danh từ "woman" là tính từ.','beauty → bỏ y, thêm iful → beautiful (xinh đẹp).']},
 {q:'5. Sunrise is an ________ school. <b>(INTERNATION)</b>', t:'text', a:['international'],
  h:['Trước danh từ "school" là tính từ.','internation + al = international (quốc tế).']},
 {q:'6. Peter is a ________ in our class. <b>(STUDY)</b>', t:'text', a:['student'],
  h:['Sau "a" cần một <b>danh từ chỉ người</b>.','Người học = student (học sinh).']},
 {q:'7. Mr Long works in a school. He is a ________. <b>(TEACH)</b>', t:'text', a:['teacher'],
  h:['Sau "a" cần danh từ chỉ người.','teach + er = teacher (giáo viên).']},
 {q:'8. I am staying in a ________ hotel. <b>(CRAZE)</b>', t:'text', a:['crazy'],
  h:['Trước danh từ "hotel" là tính từ.','craze → bỏ e, thêm y = crazy (kì lạ, điên rồ).']},
 {q:'9. They are ________ students. They like outdoor activities. <b>(ACT)</b>', t:'text', a:['active'],
  h:['Trước danh từ "students" là tính từ.','act + ive = active (năng động).']},
 {q:'10. My father is very ________. Other people like him a lot. <b>(FRIEND)</b>', t:'text', a:['friendly'],
  h:['Sau "very" là tính từ.','friend + ly = friendly (thân thiện).']}
]},
/* ================= 5 ================= */
{id:'a5', title:'Obby tìm lỗi sai', sub:'Correction – Tìm lỗi sai', theme:'obby',
 intro:'Màn Obby! Tìm đúng lỗi sai thì nhảy được sang bục tiếp theo. Sai là rơi xuống mây đấy, cờ xanh là checkpoint.',
 qs:[
 {q:'1. <u>What time</u>(A) <u>does</u>(B) Mai <u>has</u>(C) <u>English class</u>(D)?', t:'mcq', o:['What time','does','has','English class'], a:2,
  h:['Câu hỏi đã có "does" thì động từ phía sau phải ở dạng nguyên mẫu.','has → have.']},
 {q:'2. <u>Do</u>(A) you often <u>go</u>(B) <u>at</u>(C) school library <u>when you have free time</u>(D)?', t:'mcq', o:['Do','go','at','when you have free time'], a:2,
  h:['Đi <b>đến</b> đâu: go to.','at → to.']},
 {q:'3. She <u>cleans</u>(A) the floor <u>every morning</u>(B). <u>She cleans</u>(C) it <u>now</u>(D).', t:'mcq', o:['cleans','every morning','She cleans','now'], a:2,
  h:['"now" → thì hiện tại tiếp diễn.','She cleans → She is cleaning.']},
 {q:'4. <u>When</u>(A) time <u>do</u>(B) you usually <u>get up</u>(C) <u>every day</u>(D)?', t:'mcq', o:['When','do','get up','every day'], a:0,
  h:['Hỏi giờ: What time ...?','When → What.']},
 {q:'5. <u>Does</u>(A) your mother and Mrs. Lanh <u>work</u>(B) here? Yes, <u>they</u>(C) <u>do</u>(D).', t:'mcq', o:['Does','work','they','do'], a:0,
  h:['Chủ ngữ là "your mother and Mrs. Lanh" (2 người) → số nhiều.','Số nhiều dùng Do, không dùng Does.']},
 {q:'6. How <u>many</u>(A) tables <u>is</u>(B) there <u>in</u>(C) the <u>classroom</u>(D)?', t:'mcq', o:['many','is','in','classroom'], a:1,
  h:['"tables" là số nhiều.','How many ... are there ...? → is phải đổi thành are.']},
 {q:'7. What <u>does</u>(A) your sisters <u>do</u>(B) and <u>how</u>(C) old <u>are</u>(D) they?', t:'mcq', o:['does','do','how','are'], a:0,
  h:['"your sisters" là số nhiều.','does → do.']},
 {q:'8. This <u>is</u>(A) my <u>chair</u>(B) and <u>that</u>(C) are <u>your</u>(D) chairs.', t:'mcq', o:['is','chair','that','your'], a:2,
  h:['"chairs" số nhiều, động từ "are".','that (số ít) → those (số nhiều).']},
 {q:'9. There <u>are</u>(A) five <u>benchs</u>(B) and two <u>tables</u>(C) in <u>the</u>(D) house.', t:'mcq', o:['are','benchs','tables','the'], a:1,
  h:['Danh từ tận cùng là ch thì thêm <b>es</b> ở số nhiều.','bench → benches.']},
 {q:'10. This <u>is</u>(A) my <u>brother</u>(B) and <u>he\'s</u>(C) name <u>is</u>(D) Minh.', t:'mcq', o:['is','brother','he\'s','is'], a:2,
  h:['he\'s = he is. Ở đây cần tính từ sở hữu "của anh ấy".','he\'s → his.']}
]},
/* ================= 6 ================= */
{id:'a6', title:'Sống sót qua thiên tai', sub:'Reading – Đọc hiểu', theme:'disaster',
 intro:'Thiên thạch rơi, sét đánh! Đọc kĩ đoạn văn, trả lời đúng để chạy tới hầm trú ẩn.',
 qs:[
 {q:CLOZE+'Choose the word for blank <b>(1)</b>:', t:'mcq', o:['piece','part','sort','type'], a:1, h:['take part in = tham gia.']},
 {q:CLOZE+'Choose the word for blank <b>(2)</b>:', t:'mcq', o:['same','similar','another','other'], a:3, h:['Sau chỗ trống là "activities" (số nhiều).','other + danh từ số nhiều = những ... khác. another chỉ đi với số ít.']},
 {q:CLOZE+'Choose the word for blank <b>(3)</b>:', t:'mcq', o:['to maintain','maintain','maintains','maintaining'], a:0, h:['teach somebody <b>to do</b> something = dạy ai làm gì.']},
 {q:CLOZE+'Choose the word for blank <b>(4)</b>:', t:'mcq', o:['what','if','and','or'], a:2, h:['clean ____ tidy: sạch <b>và</b> gọn gàng.']},
 {q:CLOZE+'Choose the word for blank <b>(5)</b>:', t:'mcq', o:['tell','tells','told','telling'], a:1, h:['Chủ ngữ "Our principal" là số ít, việc diễn ra hằng ngày (daily) → hiện tại đơn.','tell + s = tells.']},
 {q:CLOZE+'Choose the word for blank <b>(6)</b>:', t:'mcq', o:['be','being','to be','been'], a:2, h:['learn <b>to</b> + V = học cách làm gì.','learn to be honest = học cách trở nên trung thực.']},
 {q:CLOZE+'Choose the word for blank <b>(7)</b>:', t:'mcq', o:['on','at','in','to'], a:0, h:['concentrate on = tập trung vào.']},
 {q:CLOZE+'Choose the word for blank <b>(8)</b>:', t:'mcq', o:['we','our','ours','us'], a:3, h:['Sau giới từ "for" dùng tân ngữ.','we → us.']},
 {q:READ1+'1. What is Susy\'s hair like?', t:'mcq', o:['It\'s short, curly and blonde.','It\'s long, straight and brown.','It\'s short, straight and black.','It\'s brown and straight.'], a:0, h:['Tìm tên Susy trong đoạn văn, đọc câu có chữ "hair".']},
 {q:READ1+'2. What are Caroline\'s eyes like?', t:'mcq', o:['They are black.','They are brown and big.','They are small.','They are blue.'], a:1, h:['Tìm đoạn của Caroline, đọc câu "My eyes are ...".']},
 {q:READ1+'3. What is Michael like? (tính cách)', t:'mcq', o:['He\'s shy and good tempered.','He\'s clever and hard-working.','He\'s patient and kind of lazy.','He\'s talkative and noisy.'], a:2, h:['"What is ... like?" hỏi về tính cách.','Đọc câu "I\'m patient and ..." trong đoạn của Michael.']},
 {q:READ1+'4. What does Ryan like?', t:'mcq', o:['He likes rock music.','He likes fashion.','He likes sports and video games.','He likes the green color.'], a:2, h:['Tìm "I like ..." trong đoạn của Ryan.']},
 {q:READ1+'5. What color does Kate love?', t:'mcq', o:['Red','Green','Black','Brown'], a:1, h:['Câu cuối đoạn của Kate: "I love the ... color".']},
 {q:READ2+'True or False? Đọc đoạn văn về Trung rồi chọn T (đúng) hoặc F (sai):', t:'pick', rows:[['1. Trung studies in class 7A.',['T','F'],0],['2. Trung lives with his mom and dad.',['T','F'],0],['3. Trung\'s house is big.',['T','F'],1],['4. There are three bedrooms in his house.',['T','F'],1],['5. There is a garden in his house.',['T','F'],1]],
  h:['"parents" = bố mẹ (mom and dad).','"isn\'t large" = không lớn. "two lovely bedrooms" = 2 phòng ngủ.','Bài viết nói có "a small yard" (cái sân nhỏ) ở <b>trước</b> nhà, không nói có garden trong nhà.']},
 {q:READ3+'1. Where does Minh live?', t:'mcq', o:['He lives in the factory','He lives in a town','He lives in the country','He lives in the city'], a:3, h:['Câu đầu tiên: "Minh lives in the ..."']},
 {q:READ3+'2. How many people are there in his house?', t:'mcq', o:['There are three','There are five','There are four','There are six'], a:2, h:['Đếm: Minh, mẹ, bố, chị/em gái.','Đừng quên đếm cả Minh!']},
 {q:READ3+'3. What does his father do?', t:'mcq', o:['He is a worker','He is a doctor','He is a farmer','He is a teacher'], a:0, h:['Bố Minh làm việc ở factory (nhà máy).','Người làm ở nhà máy là công nhân = worker.']},
 {q:READ3+'4. Where does Minh\'s father work?', t:'mcq', o:['He works in the hospital','He works at school','He works in the factory','He works on the farm'], a:2, h:['"Minh\'s father works in the ..."']},
 {q:READ3+'5. Where does Minh\'s mother work? – She works ...', t:'mcq', o:['at school','in the hospital','in the toystore','in the factory'], a:1, h:['Câu cuối: "His mother works in the ..."']}
]},
/* ================= 7 ================= */
{id:'a7', title:'Vượt ngục', sub:'Writing – Viết lại câu', theme:'chase', skin:'prison',
 intro:'Đạt bị nhốt nhầm vào nhà tù! Viết lại câu đúng thì song sắt mở ra. Phần đầu câu đã có sẵn, Đạt chỉ cần viết tiếp.',
 qs:[
 {q:'1. My brother often drives to work.', t:'text', pre:'My brother often goes ', a:['My brother often goes to work by car'],
  h:['drive = lái xe (ô tô).','go to work by car = đi làm bằng ô tô.']},
 {q:'2. My sister goes to the market every day on foot.', t:'text', pre:'My sister ', a:['My sister walks to the market every day','My sister walks to the market everyday'],
  h:['go on foot = đi bộ = walk.','Chủ ngữ My sister số ít → walks.']},
 {q:'4. Let\'s go out for a while.', t:'text', pre:'How about ', a:['How about going out for a while'],
  h:['How about + V-<b>ing</b>?','go → going.']},
 {q:'5. Our school has forty-two classrooms.', t:'text', pre:'There ', a:['There are forty-two classrooms in our school','There are forty two classrooms in our school','There are 42 classrooms in our school'],
  h:['S + has + N → There are + N + in + S.','forty-two classrooms là số nhiều → There are ... in our school.']},
 {q:'6. The bakery is to the left of my house.', t:'text', pre:'My house ', a:['My house is to the right of the bakery','My house is on the right of the bakery'],
  h:['Tiệm bánh ở bên <b>trái</b> nhà mình → nhà mình ở bên <b>phải</b> tiệm bánh.','to the right of = ở bên phải của.']},
 {q:'7. Mr Minh\'s hair is black.', t:'text', pre:'Mr Minh has ', a:['Mr Minh has black hair'],
  h:['N (bộ phận cơ thể) + is + adj → S + has + adj + N.','black hair.']},
 {q:'8. My house has five rooms.', t:'text', pre:'There are ', a:['There are five rooms in my house','There are 5 rooms in my house'],
  h:['Giống câu 5: There are + N + in + my house.']},
 {q:'9. My favorite subject is English.', t:'text', pre:'The subject I like ', a:['The subject I like best is English','The subject I like most is English','The subject I like the most is English','The subject I like the best is English'],
  h:['favorite = thích nhất = like best.','The subject I like best is ...']},
 {q:'10. My house is in front of a stadium.', t:'text', pre:'There is a ', a:['There is a stadium behind my house'],
  h:['Nhà ở <b>trước</b> sân vận động → sân vận động ở <b>sau</b> nhà.','behind = phía sau.']},
 {q:'10 (cách 2). My house is in front of a stadium.', t:'text', pre:'The stadium ', a:['The stadium is behind my house'],
  h:['The stadium is + giới từ + my house.']}
]},
/* ================= 8 ================= */
{id:'a8', title:'Giải cứu Quỳnh Tâm', sub:'Make sentences · Viết đoạn văn', theme:'rescue',
 intro:'Quỳnh Tâm bị nhốt trên đỉnh tháp! Viết câu đúng để leo từng bậc thang. Ở trên cùng, Đạt phải viết 2 đoạn văn để mở lồng.',
 qs:[
 {q:'1. There / a bed / corner / the room.', t:'text', pre:'', a:['There is a bed in the corner of the room'],
  h:['a bed (số ít) → There is.','"ở trong góc phòng" = in the corner of the room.']},
 {q:'4. Table / between / two chairs.', t:'text', pre:'', a:['The table is between two chairs','The table is between the two chairs','There is a table between two chairs','There is a table between the two chairs'],
  h:['Thêm "The" ở đầu và động từ "is".','The table is between two chairs.']},
 {q:'5. Lamp / next / the bed.', t:'text', pre:'', a:['The lamp is next to the bed','There is a lamp next to the bed'],
  h:['next <b>to</b> = bên cạnh.','The lamp is next to the bed.']},
 {q:'7. There / some pictures / the wall.', t:'text', pre:'', a:['There are some pictures on the wall'],
  h:['some pictures (số nhiều) → There are.','Trên tường = on the wall.']},
 {q:'8. There / a window / the left-side / the room.', t:'text', pre:'', a:['There is a window on the left side of the room','There is a window on the left-side of the room','There is a window on the left of the room'],
  h:['a window → There is.','on the left side of the room = ở phía bên trái căn phòng.']},
 {q:'10. There / some bottles / the shelf.', t:'text', pre:'', a:['There are some bottles on the shelf'],
  h:['some bottles số nhiều → There are.','Trên giá = on the shelf.']},
 {q:'1. He / often / have / breakfast / late.', t:'text', pre:'', a:['He often has breakfast late'],
  h:['often → hiện tại đơn. He → has.','Trạng từ tần suất (often) đứng trước động từ thường.']},
 {q:'2. You / do / the housework / at the moment?', t:'text', pre:'', a:['Are you doing the housework at the moment'],
  h:['at the moment → hiện tại tiếp diễn.','Câu hỏi: Are + you + V-ing ...?']},
 {q:'3. I / not / go / to school / on weekends.', t:'text', pre:'', a:["I don't go to school on weekends",'I do not go to school on weekends'],
  h:['Phủ định hiện tại đơn với I: I + don\'t + V.']},
 {q:'4. John\'s girlfriend / wear / a red T-shirt / now.', t:'text', pre:'', a:["John's girlfriend is wearing a red T-shirt now","John's girlfriend is wearing a red t-shirt now"],
  h:['now → hiện tại tiếp diễn.','girlfriend số ít → is wearing.']},
 {q:'5. They / like / beer or wine?', t:'text', pre:'', a:['Do they like beer or wine'],
  h:['Câu hỏi hiện tại đơn với They: Do + they + V ...?']},
 {q:'6. What / he / usually / do / at night?', t:'text', pre:'', a:['What does he usually do at night'],
  h:['WH + does + he + V?','usually đứng trước động từ "do".']},
 {q:'7. The teacher / never / lose / his temper.', t:'text', pre:'', a:['The teacher never loses his temper'],
  h:['never → hiện tại đơn. The teacher số ít → loses.','lose his temper = nổi nóng.']},
 {q:'8. Why / you / listen / to music / loudly now?', t:'text', pre:'', a:['Why are you listening to music loudly now'],
  h:['now → hiện tại tiếp diễn.','Why + are + you + V-ing ...?']},
 {q:'Write a short paragraph (80 – 100 words) about your <b>best friend</b>.<div class="sug">Suggestions:<br>1. What is his/her name?<br>2. How old is he/she? What does he/she look like?<br>3. What is his/her hobby? What is he/she like?<br>4. What does he/she do in his/her free time?<br>5. What do you often do together?</div>', t:'write', min:60,
  h:['Mở đầu: My best friend is ... (tên).','Ngoại hình: He/She is ... years old. He/She has short black hair and big eyes.','Tính cách, sở thích: He/She is kind and funny. He/She likes playing football.','Kết: We often ... together. I love my best friend very much.']},
 {q:'Write a short paragraph (80 – 100 words) about <b>your house</b>.<div class="sug">Suggestions:<br>1. Where do you live? (country house / city house...)<br>2. What does your house look like?<br>3. What are there in your house?<br>4. Which room in your house do you like best?<br>5. Do you like your house?</div>', t:'write', min:60,
  h:['Mở đầu: I live in a town house in Ha Noi.','Mô tả: My house is big and beautiful. It has ... rooms.','Trong nhà có gì: There is a living room, a kitchen, two bedrooms ...','Phòng thích nhất và kết: I like my bedroom best because ... I love my house very much.']}
]}
];

function uid(){return 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function letter(i){return 'ABCDEFGH'[i]}
function stripP(s){return String(s).replace(/<div class="passage">[\s\S]*?<\/div>/g,'<i>[Đọc đoạn văn]</i> ')}
function correctText(q){
  if(q.t==='mcq')return letter(q.a)+'. '+q.o[q.a];
  if(q.t==='pick')return q.rows.map(function(r){return r[0]+(/[=:]\s*$/.test(r[0])?' ':' → ')+r[1][r[2]]}).join(' | ');
  if(q.t==='set')return q.a?'{'+q.a.split(';').join('; ')+'}':'∅ (không có số nào)';
  if(q.t==='in')return (q.pre||'')+q.a[0]+(q.unit?' '+q.unit:'');
  if(q.t==='text')return q.a[0]+'.';
  return '(Bài viết tự do – chú Độ chấm)';}

function renderQ(){

  else if(q.t==='text'){h+='<div class="inrow"><input class="inp wide" id="inp" autocomplete="off" autocapitalize="sentences" spellcheck="false" value="'+esc(q.pre||'')+'" placeholder="Viết câu của Đạt vào đây"></div>'}

  h+='</div><div id="fb"></div><div class="actions"><button class="hintBtn" id="bHint"><img src="'+IMG.do+'" alt="chú Độ">Chú Độ gợi ý cách làm bài</button><span class="sp"></span>'+(q.t==='mcq'?'':'<button class="btn teal" id="bCheck">Kiểm tra</button>')+'<button class="btn hidden" id="bNext">Tiếp tục</button></div><div id="hint"></div>';
  var qc=$('#qc');qc.innerHTML=h;qc.classList.remove('locked');
  hud();
  if(q.t==='mcq')$$('.opt',qc).forEach(function(b){b.onclick=function(){if(G.busy||G.done)return;SFX.click();checkMcq(+b.dataset.i,b)}});
  if(q.t==='pick')$$('.chip',qc).forEach(function(b){b.onclick=function(){if(G.busy||G.done)return;SFX.click();var r=+b.dataset.r;G.pk[r]=+b.dataset.c;$$('.chip[data-r="'+r+'"]',qc).forEach(function(c){c.classList.toggle('sel',c===b);c.classList.remove('bad','good')});$('.prow[data-r="'+r+'"]',qc).classList.remove('wrong')}});
  $$('.key',qc).forEach(function(b){b.onclick=function(){var i=$('#inp');if(b.dataset.k==='del')i.value='';else if(b.dataset.k==='∅')i.value='∅';else{i.value=i.value.replace(/\s+$/,'')+'; '}i.focus();SFX.click()}});
  var inp=$('#inp');if(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&q.t!=='write'){e.preventDefault();doCheck()}});
    if(q.t==='write')inp.addEventListener('input',function(){$('#wc').textContent=wcount(inp.value)+' từ (cần ít nhất '+q.min+' từ, nên viết 80 – 100 từ)'});
    if(q.t==='text'&&!('ontouchstart' in window)){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}

function wcount(s){return (s.trim().match(/[A-Za-zÀ-ỹ0-9']+/g)||[]).length}

/* ----- hint ----- */
function showHint(){var q=G.q,hs=q.h||[];if(!hs.length)return;
  if(G.hint<hs.length)G.hint++;G.entry.hints=Math.max(G.entry.hints,G.hint);SFX.hint();renderHint()}
function renderHint(all){var hs=G.q.h||[],n=all?hs.length:G.hint;if(!n)return;
  var more=!all&&n<hs.length;
  $('#hint').innerHTML='<div class="hintBox"><div class="do"><img src="'+IMG.do+'" alt="chú Độ"><span>Chú Độ</span></div><div class="bubble"><ol>'+hs.slice(0,n).map(function(t){return '<li>'+fmt(t)+'</li>'}).join('')+'</ol>'+(more?'<button class="nx" id="hNx">Bước tiếp theo ('+(n+1)+'/'+hs.length+')</button>':'')+'</div></div>';
  if(more)$('#hNx').onclick=showHint;
  var b=$('#bHint');if(b&&n>=hs.length)b.classList.add('hidden')}

/* ----- checking ----- */
function normT(s){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[–—-]/g,' ').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'').trim();
  [["don't","do not"],["doesn't","does not"],["isn't","is not"],["aren't","are not"],["i'm","i am"],["it's","it is"],["there's","there is"],["what's","what is"],["let's","let us"],["everyday","every day"],["t shirt","tshirt"]].forEach(function(p){s=s.split(p[0]).join(p[1])});
  return s.replace(/\s*([,?])\s*/g,'$1 ').replace(/\s+/g,' ').trim()}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=0;j<=b.length;j++)m[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function setTok(s){return String(s).replace(/[{}]/g,' ').split(/[;,\s]+/).map(function(t){return t.trim().toUpperCase()}).filter(function(t){return t&&t!=='∅'&&t!=='Ø'&&t!=='RỖNG'})}
function doCheck(){if(G.busy||G.done)return;var q=G.q,inp=$('#inp'),ok=false,disp='',msg=null;
  if(q.t==='pick'){if(G.pk.indexOf(-1)>=0){toast('Đạt chọn đủ tất cả các dòng nhé!');return}
    var bad=[];q.rows.forEach(function(r,i){if(G.pk[i]!==r[2])bad.push(i)});ok=!bad.length;
    disp=q.rows.map(function(r,i){return r[0]+' → '+r[1][G.pk[i]]}).join(' | ');
    if(!ok)msg='Có '+bad.length+' dòng chưa đúng (đã tô đỏ). Sửa lại nhé!';
    G.badRows=bad;}
  else{var v=inp.value;if(!v.trim()||(q.t==='text'&&normT(v)===normT(q.pre||''))){toast('Đạt chưa nhập câu trả lời!');inp.focus();return}
    disp=v.trim();
    if(q.t==='in'){var d=v.replace(/[^\d]/g,'');ok=q.a.some(function(a){return a.replace(/[^\d]/g,'')===d})}
    if(q.t==='set'){var u=setTok(v),ex=q.a?q.a.split(';').map(function(t){return t.toUpperCase()}):[],uu=u.filter(function(t,i){return u.indexOf(t)===i});
      if(uu.length!==u.length){ok=false;msg='Mỗi phần tử trong tập hợp chỉ được viết <b>một lần</b> thôi!'}
      else ok=uu.length===ex.length&&ex.every(function(t){return uu.indexOf(t)>=0});
      disp=u.length?'{'+u.join('; ')+'}':'∅';}
    if(q.t==='text'){var nv=normT(v);ok=q.a.some(function(a){return normT(a)===nv});
      if(!ok){var md=Math.min.apply(null,q.a.map(function(a){return lev(normT(a),nv)}));if(md<=3)msg='Gần đúng rồi! Kiểm tra lại <b>chính tả</b> và từng từ nhé.'}}
    if(q.t==='write'){var c=wcount(v);if(c<q.min){toast('Mới có '+c+' từ. Đạt viết thêm cho đủ ít nhất '+q.min+' từ nhé!');return}ok=true}
  }
  answer(ok,disp,msg);}
function checkMcq(i,b){var q=G.q;answer(i===q.a,letter(i)+'. '+q.o[i],null,b)}

function answer(ok,disp,msg,btn){
  var q=G.q,s=G.scene;G.busy=true;G.ans.push(disp);G.entry.answers.push(disp);
  var inp=$('#inp');
  if(ok){
    var first=G.tries===0;G.entry.first=first;G.entry.final=true;G.done=true;
    if(q.t!=='write')G.coins+=first?10:5;
    if(btn)btn.classList.add('good');
    if(q.t==='pick')$$('.chip.sel').forEach(function(c){c.classList.add('good')});
    if(inp)inp.classList.add('ok');
    $('#qc').classList.add('locked');
    fb('good',q.t==='write'?'Đã lưu bài viết! Chú Độ sẽ đọc và chấm sau nhé.':(first?'Chính xác! +10 vàng':'Đúng rồi! +5 vàng'));
    SFX.correct();hud();
    s.move(G.qi,true).then(function(){G.busy=false;G.log.push(G.entry);showNext()});
  }else{
    G.tries++;G.hearts--;
    if(btn)btn.classList.add('bad');
    if(q.t==='pick')(G.badRows||[]).forEach(function(r){$('.prow[data-r="'+r+'"]').classList.add('wrong');var c=$('.chip.sel[data-r="'+r+'"]');if(c)c.classList.add('bad')});
    if(inp){inp.classList.remove('ok');inp.classList.add('no')}
    SFX.wrong();
    var last=G.tries>=2;
    fb('bad',last?'Chưa đúng rồi. Xem đáp án và cách làm của chú Độ bên dưới nhé.':(msg||'Chưa đúng! Đạt thử lại lần nữa nhé. Bí thì bấm chú Độ.'));
    if(G.hearts<0)G.hearts=0;hud();
    s.wrong(G.qi,G.hearts).then(function(){
      if(G.hearts<=0){G.hearts=3;G.revives++;SFX.heart();toast('<img src="'+IMG.do+'">Hết tim rồi! Chú Độ tặng Đạt thêm 3 tim. Cố lên!',3000);hud();if(s.th==='chase')s.setGap(3)}
      if(last){G.done=true;G.entry.final=false;$('#qc').classList.add('locked');reveal();G.log.push(G.entry);G.busy=false;$('#bNext').classList.remove('hidden');if($('#bCheck'))$('#bCheck').classList.add('hidden');G.advanceWeak=true}
      else{G.busy=false;if(inp){inp.focus();inp.select&&q.t==='in'&&inp.select()}}
    });
  }
}
function reveal(){var q=G.q;
  if(q.t==='mcq')$$('.opt').forEach(function(b){if(+b.dataset.i===q.a)b.classList.add('good')});
  if(q.t==='pick')q.rows.forEach(function(r,ri){$$('.chip[data-r="'+ri+'"]').forEach(function(c){c.classList.remove('sel','bad');if(+c.dataset.c===r[2])c.classList.add('good')})});
  $('#fb').innerHTML+='<div class="fb info">'+IC.info+'<span>Đáp án đúng: <b>'+fmt(correctText(q))+'</b></span></div>';
  renderHint(true);}
function fb(kind,txt){$('#fb').innerHTML='<div class="fb '+kind+'">'+(kind==='good'?IC.ok:IC.no)+'<span>'+txt+'</span></div>'}
function showNext(){var b=$('#bNext');b.classList.remove('hidden');if($('#bCheck'))$('#bCheck').classList.add('hidden');b.textContent=G.qi+1>=G.L.qs.length?'Về đích!':'Câu tiếp theo';b.focus()}
function next(){
  if(G.advanceWeak){G.advanceWeak=false;G.busy=true;$('#bNext').classList.add('hidden');G.scene.move(G.qi,false).then(function(){G.busy=false;go()});return}
  go();
  function go(){G.qi++;if(G.qi>=G.L.qs.length)finish();else{renderQ();var t=$('.qtag');if(t&&window.innerWidth<700)$('#stage').scrollIntoView({behavior:'smooth',block:'start'})}}
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&G&&!G.busy&&$('#bNext')&&!$('#bNext').classList.contains('hidden')&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#bNext').click()}});

/* ----- finish ----- */
function stats(){var graded=G.log.filter(function(e){return e.type!=='write'}),total=G.L.qs.filter(function(q){return q.t!=='write'}).length,
  first=graded.filter(function(e){return e.first}).length,pct=total?Math.round(first/total*100):100,
  stars=pct>=90?3:pct>=70?2:pct>=50?1:0;return {total:total,first:first,pct:pct,stars:stars,hints:G.log.reduce(function(a,e){return a+(e.hints?1:0)},0),sec:Math.round((Date.now()-G.t0)/1000)}}
function finish(){
  G.busy=true;$('#prog').style.width='100%';$('#qc').innerHTML='<div class="fb good">'+IC.ok+'<span>Đạt đã về đích! Đang tổng kết...</span></div>';
  G.scene.win().then(function(){
    BGM.stop();var st=stats();
    if(st.stars>(best[G.L.id]||0)){best[G.L.id]=st.stars;store(KEY+'best',best)}
    done[G.L.id]=true;store(KEY+'done',done);
    var p=payload('Hoàn thành',st);var sendP=send(p);
    var wrong=G.log.filter(function(e){return !e.first&&e.type!=='write'});
    var mins=Math.floor(st.sec/60),secs=st.sec%60;
    var m=modal('<h2>'+(G.L.theme==='rescue'?'Đã cứu được Quỳnh Tâm!':'Vượt qua thử thách!')+'</h2><div class="bigstars">'+[0,1,2].map(function(i){return IC.star(i<st.stars).replace('<svg','<svg style="animation-delay:'+(i*.25)+'s"')}).join('')+'</div>'+
     '<p class="lead">'+(st.stars===3?'Xuất sắc! Đạt giỏi quá!':st.stars===2?'Tốt lắm! Cố thêm chút nữa là được 3 sao.':st.stars===1?'Được rồi! Chơi lại để lấy thêm sao nhé.':'Không sao cả, chơi lại và nhờ chú Độ gợi ý nhé!')+'</p>'+
     '<div class="stats"><div class="stat"><b>'+st.first+'/'+st.total+'</b><span>đúng ngay lần đầu</span></div><div class="stat"><b>'+G.coins+'</b><span>tiền vàng</span></div><div class="stat"><b>'+mins+':'+(secs<10?'0':'')+secs+'</b><span>thời gian</span></div><div class="stat"><b>'+st.hints+'</b><span>câu nhờ chú Độ</span></div></div>'+
     '<div class="sendst" id="sendSt">Đang gửi kết quả cho chú Độ...</div>'+
     (wrong.length?'<div class="review"><h4>Các câu Đạt cần xem lại</h4>'+wrong.map(function(e){return '<div class="it">Câu '+e.n+': '+e.q+'<br>Đáp án: <em>'+e.correct+'</em></div>'}).join('')+'</div>':'')+
     '<div class="mbtns"><button class="btn ghost" id="eMap">Về bản đồ</button><button class="btn coral" id="eRe">Chơi lại</button>'+(G.li<LV.length-1?'<button class="btn" id="eNx">Thử thách tiếp</button>':'')+'</div>');
    if(st.stars)SFX.heart();
    sendP.then(function(r){$('#sendSt',m).innerHTML=r});
    $('#eMap',m).onclick=function(){m.remove();G=null;showMap()};
    $('#eRe',m).onclick=function(){var i=G.li;m.remove();play(i)};
    if($('#eNx',m))$('#eNx',m).onclick=function(){var i=G.li+1;m.remove();intro(i)};
  });
}
function confirmExit(){if(G&&G.busy)return;
  var m=modal('<h2>Về bản đồ?</h2><p class="lead">'+(G.log.length?'Đạt đã làm '+G.log.length+' câu. Phần đã làm vẫn được gửi cho chú Độ.':'Đạt chưa làm câu nào trong thử thách này.')+'</p><div class="mbtns"><button class="btn ghost" id="cS">Chơi tiếp</button><button class="btn coral" id="cX">Về bản đồ</button></div>');
  $('#cS',m).onclick=function(){m.remove()};
  $('#cX',m).onclick=function(){m.remove();if(G.log.length)send(payload('Bỏ dở ('+G.log.length+'/'+G.L.qs.length+' câu)',stats()));G=null;showMap()}}

/* ======================= SENDING ======================= */
function payload(status,st){return {id:G.id,student:CFG.STUDENT,subject:CFG.SUBJECT,subjectKey:CFG.KEY,level:G.li+1,levelId:G.L.id,levelTitle:G.L.title,levelSub:G.L.sub,status:status,
  startedAt:new Date(G.t0).toISOString(),finishedAt:new Date().toISOString(),seconds:st.sec,correctFirst:st.first,total:st.total,percent:st.pct,stars:st.stars,coins:G.coins,hintsUsed:st.hints,revives:G.revives,details:G.log}}
function qGet(){return store('qd_queue')||[]}
function qSet(a){store('qd_queue',a)}
function send(p){var a=qGet();a.push(p);qSet(a);return flush().then(function(n){
  if(!/^https:\/\/script\.google\.com\//.test(CFG.SCRIPT_URL))return '<span style="color:#b07c00">Chưa cài link Google Sheet nên kết quả chỉ lưu trên máy này.</span>';
  return qGet().some(function(x){return x.id===p.id})?'<span style="color:#b07c00">Chưa có mạng. Kết quả sẽ tự gửi lại lần sau.</span>':'<span style="color:#11692f">Đã gửi kết quả cho chú Độ.</span>'})}
var flushing=null;
function flush(){if(flushing)return flushing;
  if(!/^https:\/\/script\.google\.com\//.test(CFG.SCRIPT_URL))return Promise.resolve(0);
  var a=qGet();if(!a.length)return Promise.resolve(0);
  flushing=a.reduce(function(pr,item){return pr.then(function(){return fetch(CFG.SCRIPT_URL,{method:'POST',mode:'no-cors',keepalive:JSON.stringify(item).length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(item)})
    .then(function(){qSet(qGet().filter(function(x){return x.id!==item.id}))}).catch(function(){})})},Promise.resolve()).then(function(){flushing=null;return a.length});
  return flushing}

/* ======================= BOOT ======================= */
document.addEventListener('pointerdown',function f(){ac();document.removeEventListener('pointerdown',f)},{once:true});
window.addEventListener('online',flush);
showMap();flush();
window.__QD={LV:LV,normT:normT,setTok:setTok,G:function(){return G}};
})();

</script>
